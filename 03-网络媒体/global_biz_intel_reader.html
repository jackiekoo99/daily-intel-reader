<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="双语硬核内参">
  <title>全球商业硬核信源双语工作台 · Global Biz Intel</title>
  <style>
    :root {
      --bg-page: #F4F3EF;
      --bg-card: #FFFFFF;
      --bg-sidebar: #EAE8E1;
      --bg-hover: #DFDDD4;
      --text-main: #141413;
      --text-en: #1E1E1C;
      --text-muted: #66635B;
      --border-color: #D2CFC6;
      --border-strong: #111111;
      --accent: #990F3D;
      --ft-salmon: #990F3D;
      --accent-soft: #F0EFEA;
      --star-color: #D48806;
      --font-size-base: 18px;
      --font-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
      --font-en: "Charter", "Iowan Old Style", "Georgia", serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    body.theme-warm {
      --bg-page: #FFF1E5;
      --bg-card: #FFF9F5;
      --bg-sidebar: #F2DFCE;
      --bg-hover: #E9D1BC;
      --text-main: #22201E;
      --text-en: #2C2A28;
      --text-muted: #66605C;
      --border-color: #DFC8B4;
      --border-strong: #990F3D;
      --accent: #990F3D;
      --accent-soft: #F9E8D9;
    }

    body.theme-dark {
      --bg-page: #161618;
      --bg-card: #202024;
      --bg-sidebar: #1B1B1E;
      --bg-hover: #2A2A30;
      --text-main: #E6E4DF;
      --text-en: #CFCBC2;
      --text-muted: #949087;
      --border-color: #333338;
      --border-strong: #D94862;
      --accent: #E0526B;
      --accent-soft: #262225;
    }

    body.font-serif-zh {
      --font-zh: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    }

    body.size-sm { --font-size-base: 15.5px; }
    body.size-md { --font-size-base: 17.5px; }
    body.size-lg { --font-size-base: 19.5px; }
    body.size-xl { --font-size-base: 21.5px; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-zh);
      font-size: var(--font-size-base);
      line-height: 1.85;
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==================== 左侧榜单栏（电脑端固定栏 / 手机端全屏榜单页） ==================== */
    .sidebar {
      width: 370px;
      min-width: 370px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: margin-left 0.25s ease;
    }
    .sidebar.collapsed { margin-left: -370px; }

    .bookshelf-bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--accent-soft);
    }
    .bookshelf-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .bookshelf-select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 2px solid var(--border-strong);
      background-color: var(--bg-card);
    }
    .intel-badge {
      display: inline-flex;
      background: var(--border-strong);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.6px;
      padding: 2px 8px;
      border-radius: 3px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
    }
    .sidebar-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-sidebar);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 5px 11px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: var(--border-strong);
      color: #fff;
      border-color: var(--border-strong);
    }

    .catalog-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 32px;
      -webkit-overflow-scrolling: touch;
    }
    .catalog-item {
      padding: 12px 13px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: all 0.15s;
    }
    .catalog-item:hover { background-color: var(--bg-hover); }
    .catalog-item.active {
      border-color: var(--border-strong);
      border-left: 4px solid var(--border-strong);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .catalog-item.radar-only { opacity: 0.9; }

    .item-left { flex: 1; min-width: 0; }
    .item-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 5px;
    }
    .score-pill {
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11px;
      background: #990F3D;
      color: #FFFFFF;
    }
    .score-pill.tier-mid { background: #1D4ED8; color: #FFFFFF; }
    .score-pill.tier-low { background: #6B7280; color: #FFFFFF; }

    .sec-tag {
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 10.5px;
      background: #E0DDD3;
      color: #222;
    }
    .sec-tag.sec-stratechery { background: #D0EBFF; color: #0B4F82; }
    .sec-tag.sec-physics { background: #D8F3DC; color: #0B5328; }
    .sec-tag.sec-ft { background: #FADBD8; color: #78281F; }
    .sec-tag.sec-bloomberg { background: #E8DAEF; color: #4A235A; }
    .sec-tag.sec-theinfo { background: #FCF3CF; color: #7D6608; }
    .sec-tag.sec-nikkei { background: #D1F2EB; color: #0E6251; }

    .item-zh {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.42;
      margin-bottom: 4px;
    }
    .item-en {
      font-size: 12.5px;
      color: var(--text-muted);
      font-family: var(--font-en);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #BDB7AA;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
    }
    .star-btn.starred { color: var(--star-color); }

    /* ==================== 右侧正文区 ==================== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    .topbar {
      height: 54px;
      border-bottom: 2px solid var(--border-strong);
      background-color: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tool-btn {
      padding: 5px 10px;
      font-size: 12.5px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 600;
      text-decoration: none;
    }
    .tool-btn:hover { background-color: var(--bg-hover); }
    .tool-btn.active {
      background-color: var(--border-strong);
      color: #fff;
      border-color: var(--border-strong);
    }
    .tool-btn.star-main.starred {
      background-color: #FDF6EA;
      border-color: var(--star-color);
      color: #9E5E0B;
      font-weight: 700;
    }
    .divider {
      width: 1px;
      height: 18px;
      background-color: var(--border-color);
      margin: 0 2px;
    }

    /* 手机端专属顶部导航栏（默认隐藏，手机端阅读时显示） */
    .mobile-topbar {
      display: none;
      height: 48px;
      padding: 0 12px;
      background-color: var(--bg-card);
      border-bottom: 1.5px solid var(--border-strong);
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 910;
    }
    .mob-back-btn {
      border: 1px solid var(--border-color);
      background: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mob-top-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      max-width: 48vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mob-top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 36px 44px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .article-container {
      max-width: 1240px;
      margin: 0 auto;
    }
    .mode-zh .article-container,
    .mode-stack .article-container,
    .mode-en .article-container {
      max-width: 780px;
    }

    .article-header {
      margin-bottom: 26px;
      padding-top: 12px;
      padding-bottom: 22px;
      border-top: 4px solid var(--border-strong);
      border-bottom: 2px solid var(--border-strong);
    }
    .article-kicker-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .kicker-badge {
      background-color: var(--border-strong);
      color: #FFFFFF;
      padding: 3px 9px;
      font-weight: 700;
      border-radius: 3px;
    }
    .kicker-author { color: var(--text-muted); font-weight: 600; }
    .kicker-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      margin-left: auto;
    }

    .article-title-zh {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .article-title-en {
      font-family: var(--font-en);
      font-size: 19px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.38;
      margin-bottom: 16px;
    }

    .score-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid #990F3D;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .score-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .score-total-badge {
      background: #990F3D;
      color: #fff;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 3px;
    }

    .article-deck {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--border-strong);
      padding: 14px 18px;
      border-radius: 0 6px 6px 0;
      color: var(--text-main);
      font-size: 0.96em;
      line-height: 1.8;
    }
    .article-deck-en {
      font-family: var(--font-en);
      color: var(--text-muted);
      font-style: italic;
      margin-top: 8px;
      font-size: 0.92em;
    }

    /* 文章配图（兼容《经济学人》插图） */
    .hero-figure, .inline-figure {
      margin: 18px 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .hero-figure img, .inline-figure img {
      width: 100%;
      height: auto;
      display: block;
    }
    .fig-cap {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ==================== 段落级 1:1 精细对照 ==================== */
    .pair-block {
      border-bottom: 1px solid var(--border-color);
      padding: 20px 0;
    }
    .pair-block:last-child { border-bottom: none; }

    .sub-pair-row {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 38px;
      align-items: start;
      margin-bottom: 16px;
    }
    .sub-pair-row:last-of-type { margin-bottom: 0; }

    .col-en {
      font-family: var(--font-en);
      color: var(--text-en);
      font-size: 0.98em;
      line-height: 1.78;
    }
    .col-zh {
      color: var(--text-main);
      font-size: 1em;
      line-height: 1.88;
      letter-spacing: 0.015em;
      position: relative;
    }

    /* 纯中文模式下的『点按展开本段英文』按钮 */
    .toggle-en-pill {
      display: none;
      margin-left: 6px;
      padding: 1px 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      vertical-align: middle;
    }

    /* 上英下中单列对照模式 */
    .mode-stack .sub-pair-row {
      display: block;
      margin-bottom: 22px;
    }
    .mode-stack .col-en {
      margin-bottom: 10px;
      padding: 11px 14px;
      background: var(--bg-card);
      border-radius: 6px;
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent);
      font-size: 0.95em;
      line-height: 1.72;
    }
    .mode-stack .col-zh {
      padding: 0 2px;
    }

    /* 纯中文畅读（支持单段点开看原文） */
    .mode-zh .pair-block { padding: 12px 0; }
    .mode-zh .sub-pair-row { display: block; margin-bottom: 16px; }
    .mode-zh .col-en, .mode-zh .article-deck-en { display: none; }
    .mode-zh .sub-pair-row.expand-en .col-en {
      display: block;
      margin-bottom: 10px;
      padding: 10px 13px;
      background: var(--bg-card);
      border-radius: 6px;
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent);
      font-size: 0.94em;
    }
    .mode-zh .toggle-en-pill { display: inline-block; }

    /* 纯英文原版模式 */
    .mode-en .sub-pair-row { display: block; margin-bottom: 16px; }
    .mode-en .col-zh { display: none; }

    .vocab-inline {
      border-bottom: 1.5px dashed #B84A32;
      background-color: rgba(184, 74, 50, 0.08);
      padding: 0 2px;
      border-radius: 2px;
      cursor: pointer;
    }

    .fn-badge {
      display: inline-block;
      font-size: 0.78em;
      font-weight: 700;
      color: var(--accent);
      background: rgba(153, 15, 61, 0.1);
      border-radius: 3px;
      padding: 1px 4px;
      margin: 0 2px;
      cursor: pointer;
      vertical-align: super;
    }

    /* 段落级操作栏 */
    .pair-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .pair-share-btn {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 查词与注释卡片（手机端自动变底部半屏抽屉 Bottom Sheet） */
    .footnote-popover, .vocab-popover {
      position: fixed;
      z-index: 10000;
      width: 400px;
      max-width: calc(100vw - 24px);
      background-color: #1F1E1B;
      color: #F7F5F0;
      border-radius: 10px;
      padding: 16px 18px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.45);
      font-size: 14px;
      line-height: 1.65;
      display: none;
      border: 1px solid #44413C;
    }
    .footnote-popover.visible, .vocab-popover.visible { display: block; }
    .fn-pop-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid #38352F;
      padding-bottom: 6px;
    }
    .fn-pop-title { font-size: 14.5px; font-weight: 700; color: #FF8F8C; }
    .fn-pop-close {
      background: none;
      border: none;
      color: #A09C92;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .footnotes-section {
      margin: 32px 0 20px;
      padding: 20px 22px;
      background-color: var(--bg-sidebar);
      border-left: 4px solid var(--border-strong);
      border-radius: 0 8px 8px 0;
    }
    .footnotes-section h3 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .fn-item { margin-bottom: 12px; font-size: 14px; line-height: 1.7; }
    .fn-item-badge { font-weight: 700; color: var(--accent); margin-right: 6px; }

    .footer-nav {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 2px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 生词篮抽屉 */
    .basket-drawer {
      position: fixed;
      top: 54px;
      right: 0;
      width: 390px;
      max-width: 100vw;
      height: calc(100% - 54px);
      background-color: var(--bg-card);
      border-left: 2px solid var(--border-strong);
      box-shadow: -4px 0 18px rgba(0,0,0,0.12);
      z-index: 960;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.25s ease;
    }
    .basket-drawer.open { transform: translateX(0); }
    .basket-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .basket-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .basket-item {
      background: var(--bg-page);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
    }
    .basket-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    /* 手机端字号与外观设置底部面板 */
    .settings-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 10200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .settings-sheet-overlay.open { display: flex; }
    .settings-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
      border-top: 2px solid var(--border-strong);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
    }
    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .sheet-row:last-child { margin-bottom: 0; }
    .sheet-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 64px;
    }
    .sheet-group {
      display: flex;

  <script src="global_biz_intel_data.js"></script>
  <script>
    window.BOOKSHELF_REGISTRY = window.BOOKSHELF_REGISTRY || {};
    let currentBookKey = 'global_biz_intel';
    let DATA = window.BOOKSHELF_REGISTRY['global_biz_intel'] || window.READER_DATA || { storageKey: 'global_biz_intel', catalog: [], articles: {} };

    const BASKET_STORAGE_KEY = 'bilingual_global_vocab_basket';
    let vocabBasket = JSON.parse(localStorage.getItem(BASKET_STORAGE_KEY) || '[]');
    let starredIds = [];
    let currentFilter = 'all';
    let currentArticleId = 1;
    let activePopoverContext = null;

    function fixEconomistImgPath(src) {
      if (!src) return '';
      if (src.startsWith('economist_2026_10_24_assets/')) {
        return '../01-期刊杂志/' + src;
      }
      return src;
    }

    function loadBookData(bookKey) {
      currentBookKey = bookKey;
      DATA = window.BOOKSHELF_REGISTRY[bookKey] || DATA;
      starredIds = JSON.parse(localStorage.getItem((DATA.storageKey || bookKey) + '_starred_ids') || '[]');
      document.getElementById('issueTitle').textContent = DATA.issueTitle || '双语伴读工作台';
      document.getElementById('issueSubtitle').textContent = DATA.issueSubtitle || '';
      document.getElementById('sidebarBadge').textContent = bookKey === 'economist_2026_10_24'
        ? 'THE ECONOMIST · 2026.10.24'
        : 'GLOBAL BIZ INTEL · 每日同步';

      const savedId = parseInt(localStorage.getItem((DATA.storageKey || bookKey) + '_last_id') || '0', 10);
      const firstReady = (DATA.catalog.find(c => c.ready) || DATA.catalog[0] || { id: 1 }).id;
      currentArticleId = (savedId && DATA.articles[savedId]) ? savedId : firstReady;
      currentFilter = 'all';
      document.querySelectorAll('.filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btnFilterAll').classList.add('active');
      renderCatalog();
      selectArticle(currentArticleId, false);
    }

    function switchBook(bookKey) {
      if (window.BOOKSHELF_REGISTRY && window.BOOKSHELF_REGISTRY[bookKey]) {
        loadBookData(bookKey);
        return;
      }
      const routes = {
        wired_2026_10: '../01-期刊杂志/wired_2026_10_reader.html',
        anthropic_s1: '../02-英文书籍/Anthropic S-1 Prospectus/anthropic_s1_reader.html',
        the_infinity_machine: '../02-英文书籍/The Infinity Machine/the_infinity_machine_reader.html',
        the_thinking_machine: '../02-英文书籍/The Thinking Machine/the_thinking_machine_reader.html',
        classic_essays: '../05-经典美文/classic_essays_reader.html',
        bookshelf_hub: '../02-英文书籍/bookshelf.html'
      };
      if (routes[bookKey]) {
        window.location.href = routes[bookKey];
      }
    }

    function getSectionClass(sec) {
      const s = (sec || '').toLowerCase();
      if (s.includes('stratechery')) return 'sec-stratechery';
      if (s.includes('physics')) return 'sec-physics';
      if (s.includes('ft') || s.includes('leader')) return 'sec-ft';
      if (s.includes('bloomberg') || s.includes('money stuff')) return 'sec-bloomberg';
      if (s.includes('information') || s.includes('business')) return 'sec-theinfo';
      if (s.includes('nikkei')) return 'sec-nikkei';
      return '';
    }

    function saveStarred() {
      localStorage.setItem((DATA.storageKey || currentBookKey) + '_starred_ids', JSON.stringify(starredIds));
    }

    function toggleStar(id, event) {
      if (event) event.stopPropagation();
      const idx = starredIds.indexOf(id);
      if (idx === -1) starredIds.push(id);
      else starredIds.splice(idx, 1);
      saveStarred();
      renderCatalog();
      updateCurrentStarBtn();
    }

    function toggleStarCurrent() { toggleStar(currentArticleId); }

    function updateCurrentStarBtn() {
      const isStar = starredIds.includes(currentArticleId);
      const btn = document.getElementById('btnStarCurrent');
      if (btn) {
        btn.classList.toggle('starred', isStar);
        btn.textContent = isStar ? '★ 已记入待精读' : '☆ 记入待精读';
      }
      const mobTopStar = document.getElementById('mobTopStarBtn');
      if (mobTopStar) {
        mobTopStar.textContent = isStar ? '★ 已标星' : '☆ 标星';
        mobTopStar.style.color = isStar ? '#D48806' : '';
      }
    }

    function setFilter(filter, btnEl) {
      currentFilter = filter;
      document.querySelectorAll('.filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderCatalog();
    }

    function renderCatalog() {
      const listEl = document.getElementById('catalogList');
      listEl.innerHTML = '';
      document.getElementById('btnFilterAll').textContent = `全部 (${DATA.catalog.length})`;
      DATA.catalog.forEach((item, idx) => {
        const isStar = starredIds.includes(item.id);
        if (currentFilter === 'ready' && !item.ready) return;
        if (currentFilter === 'radar' && item.ready) return;
        if (currentFilter === 'starred' && !isStar) return;

        const div = document.createElement('div');
        div.className = 'catalog-item' +
          (item.id === currentArticleId ? ' active' : '') +
          (!item.ready ? ' radar-only' : '');
        div.onclick = () => selectArticle(item.id, true);

        const numStr = String(idx + 1).padStart(2, '0');
        const secClass = getSectionClass(item.section);
        const modeTag = item.rewritten ? '✅ 已精编' : (item.ready ? '📖 全文' : '📡 雷达');
        const sc = item.score ? item.score.total : 0;
        const tierClass = sc >= 90 ? '' : (sc >= 83 ? 'tier-mid' : 'tier-low');
        const scoreHtml = sc ? `<span class="score-pill ${tierClass}">${sc}分</span>` : '';

        div.innerHTML = `
          <div class="item-left">
            <div class="item-meta">
              <span>#${numStr}</span>
              ${scoreHtml}
              <span class="sec-tag ${secClass}">${item.section}</span>
              <span>· ${modeTag}</span>
            </div>
            <div class="item-zh">${item.zhTitle}</div>
            <div class="item-en">${item.enTitle}</div>
          </div>
          <button class="star-btn ${isStar ? 'starred' : ''}" onclick="toggleStar(${item.id}, event)" title="记入待精读">
            ${isStar ? '★' : '☆'}
          </button>
        `;
        listEl.appendChild(div);
      });
    }

    function highlightVocabInText(text, vocabList) {
      if (!vocabList || !vocabList.length) return text;
      let result = text;
      vocabList.forEach((v, idx) => {
        const escaped = v.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b(${escaped})\\b`, 'i');
        result = result.replace(regex, `<span class="vocab-inline" data-vocab-idx="${idx}">$1</span>`);
      });
      return result;
    }

    function showMobileCatalog() {
      document.body.classList.remove('mobile-reading');
    }

    function selectArticle(id, enterMobileReader) {
      hideFootnotePopover();
      hideVocabPopover();
      currentArticleId = id;
      localStorage.setItem((DATA.storageKey || currentBookKey) + '_last_id', String(id));
      renderCatalog();
      updateCurrentStarBtn();
      renderArticleContent(id);
      document.getElementById('readerScroll').scrollTop = 0;
      if (enterMobileReader && window.innerWidth <= 768) {
        document.body.classList.add('mobile-reading');
      }
    }

    function toggleSubPairEn(btnEl) {
      const row = btnEl.closest('.sub-pair-row');
      if (row) {
        const expanded = row.classList.toggle('expand-en');
        btnEl.textContent = expanded ? '收起原文' : 'EN 原文';
      }
    }

    function renderArticleContent(id) {
      const container = document.getElementById('articleContainer');
      const article = DATA.articles[id];
      if (!article) return;

      const catIdx = DATA.catalog.findIndex(c => c.id === id);
      const rankNum = catIdx >= 0 ? catIdx + 1 : id;
      const numStr = String(rankNum).padStart(2, '0');

      const mobTitle = document.getElementById('mobTopTitle');
      if (mobTitle) {
        const scText = (article.score && article.score.total) ? ` (${article.score.total}分)` : '';
        mobTitle.textContent = `#${numStr}${scText} · ${article.zhTitle}`;
      }

      const vocabList = article.vocab || [];
      let pairsHtml = '';
      (article.pairs || []).forEach((pair, pIdx) => {
        const enArr = pair.en || [];
        const zhArr = pair.zh || [];
        const maxLen = Math.max(enArr.length, zhArr.length);
        let subRowsHtml = '';

        for (let i = 0; i < maxLen; i++) {
          const enP = enArr[i] ? `<p>${highlightVocabInText(enArr[i], vocabList)}</p>` : '';
          let zhP = '';
          if (zhArr[i]) {
            const formattedZh = zhArr[i].replace(
              /〔注(\d+)〕/g,
              '<sup class="fn-badge" onclick="showFootnotePopover(event, \'$1\')">〔注$1〕</sup>'
            );
            const enToggleBtn = enArr[i]
              ? `<button class="toggle-en-pill" onclick="toggleSubPairEn(this)">EN 原文</button>`
              : '';
            zhP = `<p>${formattedZh}${enToggleBtn}</p>`;
          }
          subRowsHtml += `
            <div class="sub-pair-row">
              <div class="col-en">${enP}</div>
              <div class="col-zh">${zhP}</div>
            </div>
          `;
        }

        pairsHtml += `
          <div class="pair-block">
            ${subRowsHtml}
            <div class="pair-actions">
              <button class="pair-share-btn" onclick="openShareCardModal(${pIdx})">📤 制成双语金句卡</button>
            </div>
          </div>
        `;
      });

      let heroHtml = '';
      if (article.heroImage && article.heroImage.src) {
        const imgSrc = fixEconomistImgPath(article.heroImage.src);
        heroHtml = `
          <figure class="hero-figure">
            <img src="${imgSrc}" alt="" loading="lazy">
            ${article.heroImage.caption ? `<figcaption class="fig-cap">${article.heroImage.caption}</figcaption>` : ''}
          </figure>
        `;
      }

      let footnotesHtml = '';
      if (article.footnotes && Object.keys(article.footnotes).length > 0) {
        const items = Object.entries(article.footnotes).map(([k, fn]) => `
          <div class="fn-item">
            <span class="fn-item-badge">${fn.title || `〔注${k}〕`}</span>
            <span>${fn.content}</span>
          </div>
        `).join('');
        footnotesHtml = `
          <section class="footnotes-section">
            <h3>📚 商业机制与深度考据注释</h3>
            <div>${items}</div>
          </section>
        `;
      }

      const prevItem = catIdx > 0 ? DATA.catalog[catIdx - 1] : null;
      const nextItem = (catIdx >= 0 && catIdx < DATA.catalog.length - 1) ? DATA.catalog[catIdx + 1] : null;
      const s = article.score;
      const scorePanelHtml = s ? `
        <div class="score-panel">
          <div class="score-metrics">
            <span class="score-total-badge">综合加权分：${s.total}</span>
            <span>相关性(30%)：<b>${s.rel}</b></span>
            <span>质量与机制(25%)：<b>${s.qual}</b></span>
            <span>写作技巧(20%)：<b>${s.craft}</b></span>
            <span>影响力(15%)：<b>${s.impact}</b></span>
            <span>热度(10%)：<b>${s.buzz}</b></span>
          </div>
          <div style="color:var(--text-muted);font-size:12.5px;">📌 <b>评分依据</b>：${s.reason}</div>
        </div>
      ` : '';

      container.innerHTML = `
        <article>
          <header class="article-header">
            <div class="article-kicker-bar">
              <span class="kicker-badge">#${numStr} // ${article.section}</span>
              <span class="kicker-author">${article.author || ''} ${article.date ? '· ' + article.date : ''}</span>
              ${article.link ? `<a class="kicker-link" href="${article.link}" target="_blank">原文链接 ↗</a>` : ''}
            </div>
            <h1 class="article-title-zh">${article.zhTitle}</h1>
            <div class="article-title-en">${article.enTitle}</div>
            ${scorePanelHtml}
            <div class="article-deck">
              <div>${article.zhDeck}</div>
              ${article.enDeck ? `<div class="article-deck-en">${article.enDeck}</div>` : ''}
            </div>
            ${heroHtml}
          </header>
          <section class="pairs-body">${pairsHtml}</section>
          ${footnotesHtml}
          <footer class="footer-nav">
            <div>${prevItem ? `<button class="tool-btn" onclick="selectArticle(${prevItem.id}, true)">← 上一篇 (#${String(catIdx).padStart(2, '0')})</button>` : ''}</div>
            <div>
              <button class="tool-btn star-main ${starredIds.includes(id) ? 'starred' : ''}" onclick="toggleStarCurrent()">
                ${starredIds.includes(id) ? '★ 已记入待精读' : '☆ 记入待精读'}
              </button>
            </div>
            <div>${nextItem ? `<button class="tool-btn" onclick="selectArticle(${nextItem.id}, true)">下一篇 (#${String(catIdx + 2).padStart(2, '0')}) →</button>` : ''}</div>
          </footer>
        </article>
      `;

      container.querySelectorAll('.vocab-inline[data-vocab-idx]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(el.getAttribute('data-vocab-idx'), 10);
          const v = vocabList[idx];
          const sentence = el.closest('p') ? el.closest('p').innerText : '';
          showVocabPopover(el.getBoundingClientRect(), {
            term: v.term,
            phonetic: v.phonetic || '',
            pos: v.pos || '',
            meaning: v.meaning,
            note: v.note || '',
            context: sentence
          });
        });
      });
    }

    function showVocabPopover(rect, info) {
      activePopoverContext = info;
      hideFootnotePopover();
      const pop = document.getElementById('vocabPopover');
      pop.innerHTML = `
        <div class="fn-pop-head">
          <span class="fn-pop-title">${info.term} <small style="color:#B5B0A6;font-weight:400;">${info.phonetic}</small></span>
          <button class="fn-pop-close" onclick="hideVocabPopover()">✕</button>
        </div>
        <div style="font-weight:600;margin-bottom:6px;">${info.pos ? '[' + info.pos + '] ' : ''}${info.meaning}</div>
        ${info.note ? `<div style="font-size:13px;color:#D0CBBF;margin-bottom:12px;">${info.note}</div>` : ''}
        <button class="tool-btn active" style="width:100%;padding:8px;" onclick="addActiveToBasket()">+ 收进生词篮</button>
      `;
      pop.classList.add('visible');
      if (window.innerWidth > 768) {
        pop.style.top = Math.min(window.innerHeight - 220, rect.bottom + 8) + 'px';
        pop.style.left = Math.min(window.innerWidth - 420, Math.max(16, rect.left)) + 'px';
      }
    }

    function hideVocabPopover() {
      document.getElementById('vocabPopover').classList.remove('visible');
    }

    function addActiveToBasket() {
      if (!activePopoverContext) return;
      const meta = DATA.catalog.find(c => c.id === currentArticleId);
      if (!vocabBasket.some(x => x.term.toLowerCase() === activePopoverContext.term.toLowerCase())) {
        vocabBasket.unshift({
          term: activePopoverContext.term,
          meaning: activePopoverContext.meaning,
          context: activePopoverContext.context,
          articleTitle: meta ? meta.zhTitle : ''
        });
        localStorage.setItem(BASKET_STORAGE_KEY, JSON.stringify(vocabBasket));
        renderBasket();
      }
      hideVocabPopover();
    }

    function showFootnotePopover(e, fnKey) {
      if (e) e.stopPropagation();
      hideVocabPopover();
      const article = DATA.articles[currentArticleId];
      if (!article || !article.footnotes || !article.footnotes[fnKey]) return;
      const fn = article.footnotes[fnKey];
      const pop = document.getElementById('footnotePopover');
      pop.innerHTML = `
        <div class="fn-pop-head">
          <span class="fn-pop-title">${fn.title || `〔注${fnKey}〕`}</span>
          <button class="fn-pop-close" onclick="hideFootnotePopover()">✕</button>
        </div>
        <div>${fn.content}</div>
      `;
      pop.classList.add('visible');
      if (window.innerWidth > 768) {
        const rect = e.currentTarget.getBoundingClientRect();
        pop.style.top = Math.min(window.innerHeight - 220, rect.bottom + 8) + 'px';
        pop.style.left = Math.min(window.innerWidth - 420, Math.max(16, rect.left - 20)) + 'px';
      }
    }

    function hideFootnotePopover() {
      document.getElementById('footnotePopover').classList.remove('visible');
    }

    function setTheme(themeName) {
      document.body.classList.remove('theme-warm', 'theme-dark');
      if (themeName === 'warm') document.body.classList.add('theme-warm');
      if (themeName === 'dark') document.body.classList.add('theme-dark');
      document.getElementById('sheetThemeWarm').classList.toggle('active', themeName === 'warm');
      document.getElementById('sheetThemeLight').classList.toggle('active', themeName === 'light');
      document.getElementById('sheetThemeDark').classList.toggle('active', themeName === 'dark');
      const btn = document.getElementById('btnTheme');
      if (btn) {
        btn.textContent = themeName === 'warm' ? '📰 风格：FT 鲑鱼粉' : (themeName === 'dark' ? '🌙 风格：夜间深色' : '⚡ 风格：清爽白纸');
      }
    }

    function cycleTheme() {
      if (document.body.classList.contains('theme-warm')) setTheme('light');
      else if (document.body.classList.contains('theme-dark')) setTheme('warm');
      else setTheme('dark');
    }

    function setZhFont(useSerif) {
      document.body.classList.toggle('font-serif-zh', useSerif);
      document.getElementById('sheetFontSans').classList.toggle('active', !useSerif);
      document.getElementById('sheetFontSerif').classList.toggle('active', useSerif);
      const btn = document.getElementById('btnFont');
      if (btn) btn.textContent = useSerif ? '字体：书卷宋体' : '字体：清爽黑体';
    }

    function toggleZhFont() {
      setZhFont(!document.body.classList.contains('font-serif-zh'));
    }

    function setFontSize(size, btnEl) {
      document.body.classList.remove('size-sm', 'size-md', 'size-lg', 'size-xl');
      document.body.classList.add('size-' + size);
      ['Sm', 'Md', 'Lg', 'Xl'].forEach(s => {
        const el = document.getElementById('sheetSize' + s);
        if (el) el.classList.toggle('active', s.toLowerCase() === size);
      });
      if (btnEl) {
        document.querySelectorAll('.topbar-right .tool-btn').forEach(b => {
          if (['小', '标准', '大', '特大'].includes(b.textContent)) b.classList.remove('active');
        });
        btnEl.classList.add('active');
      }
    }

    function openSettingsSheet() {
      document.getElementById('settingsSheet').classList.add('open');
    }
    function closeSettingsSheet() {
      document.getElementById('settingsSheet').classList.remove('open');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function setViewMode(mode) {
      const main = document.getElementById('mainArea');
      main.classList.remove('mode-zh', 'mode-stack', 'mode-en');
      ['btnModeSide', 'btnModeZh', 'btnModeStack', 'btnModeEn', 'sheetModeStack', 'sheetModeZh', 'sheetModeEn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
      });

      const lbl = document.getElementById('mobModeLabel');
      if (mode === 'zh') {
        main.classList.add('mode-zh');
        if (document.getElementById('btnModeZh')) document.getElementById('btnModeZh').classList.add('active');
        if (document.getElementById('sheetModeZh')) document.getElementById('sheetModeZh').classList.add('active');
        if (lbl) lbl.textContent = '纯中文';
      } else if (mode === 'en') {
        main.classList.add('mode-en');
        if (document.getElementById('btnModeEn')) document.getElementById('btnModeEn').classList.add('active');
        if (document.getElementById('sheetModeEn')) document.getElementById('sheetModeEn').classList.add('active');
        if (lbl) lbl.textContent = '纯英文';
      } else if (mode === 'stack') {
        main.classList.add('mode-stack');
        if (document.getElementById('btnModeStack')) document.getElementById('btnModeStack').classList.add('active');
        if (document.getElementById('sheetModeStack')) document.getElementById('sheetModeStack').classList.add('active');
        if (lbl) lbl.textContent = '逐段双语';
      } else {
        if (document.getElementById('btnModeSide')) document.getElementById('btnModeSide').classList.add('active');
      }
    }

    function cycleMobileViewMode() {
      const main = document.getElementById('mainArea');
      if (main.classList.contains('mode-stack')) {
        setViewMode('zh');
      } else if (main.classList.contains('mode-zh')) {
        setViewMode('en');
      } else {
        setViewMode('stack');
      }
    }

    function wrapCanvasLines(ctx, text, maxWidth) {
      const lines = [];
      const paragraphs = (text || '').split('\n');
      paragraphs.forEach(para => {
        let line = '';
        for (let i = 0; i < para.length; i++) {
          const testLine = line + para[i];
          if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
            lines.push(line);
            line = para[i];
          } else {
            line = testLine;
          }
        }
        if (line) lines.push(line);
      });
      return lines;
    }

    let currentSharePairIdx = -1;

    function openShareCardModal(pairIdx) {
      currentSharePairIdx = pairIdx;
      const article = DATA.articles[currentArticleId];
      if (!article) return;

      const pair = (pairIdx >= 0 && article.pairs && article.pairs[pairIdx])
        ? article.pairs[pairIdx]
        : (article.pairs && article.pairs[0] ? article.pairs[0] : { en: [article.enDeck || ''], zh: [article.zhDeck || ''] });

      const enText = (pair.en || []).slice(0, 2).join('\n').replace(/<[^>]+>/g, '').slice(0, 380);
      const zhText = (pair.zh || []).slice(0, 2).join('\n').replace(/〔注\d+〕/g, '').slice(0, 380);

      const canvas = document.createElement('canvas');
      const dpr = 2;
      const width = 720;
      const pad = 48;
      const contentWidth = width - pad * 2;
      const ctx = canvas.getContext('2d');

      ctx.font = 'bold 30px "PingFang SC", sans-serif';
      const titleLines = wrapCanvasLines(ctx, article.zhTitle, contentWidth);

      ctx.font = '21px Charter, Georgia, serif';
      const enLines = wrapCanvasLines(ctx, enText, contentWidth - 28);

      ctx.font = '23px "PingFang SC", sans-serif';
      const zhLines = wrapCanvasLines(ctx, zhText, contentWidth);

      const totalHeight = 140 + titleLines.length * 44 + 40 + enLines.length * 34 + 50 + zhLines.length * 40 + 130;
      canvas.width = width * dpr;
      canvas.height = totalHeight * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = '#FFF1E5';
      ctx.fillRect(0, 0, width, totalHeight);

      ctx.fillStyle = '#990F3D';
      ctx.fillRect(pad, 40, contentWidth, 5);
      ctx.fillRect(pad, 58, 220, 30);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 15px monospace';
      ctx.fillText('GLOBAL BIZ INTEL · 双语内参', pad + 10, 78);

      if (article.score && article.score.total) {
        ctx.fillStyle = '#990F3D';
        ctx.font = 'bold 17px monospace';
        ctx.fillText(`五维评分: ${article.score.total} / 100`, width - pad - 185, 78);
      }

      let curY = 132;
      ctx.fillStyle = '#1A1817';
      ctx.font = 'bold 30px "PingFang SC", sans-serif';
      titleLines.forEach(line => {
        ctx.fillText(line, pad, curY);
        curY += 44;
      });

      curY += 16;
      const enBoxH = enLines.length * 34 + 28;
      ctx.fillStyle = '#F9E8D9';
      ctx.fillRect(pad, curY, contentWidth, enBoxH);
      ctx.fillStyle = '#990F3D';
      ctx.fillRect(pad, curY, 5, enBoxH);

      ctx.fillStyle = '#2F2E2C';
      ctx.font = '21px Charter, Georgia, serif';
      let enY = curY + 32;
      enLines.forEach(line => {
        ctx.fillText(line, pad + 20, enY);
        enY += 34;
      });

      curY += enBoxH + 38;
      ctx.fillStyle = '#1A1817';
      ctx.font = '23px "PingFang SC", sans-serif';
      zhLines.forEach(line => {
        ctx.fillText(line, pad, curY);
        curY += 40;
      });

      curY += 24;
      ctx.strokeStyle = '#DFC8B4';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pad, curY);
      ctx.lineTo(width - pad, curY);
      ctx.stroke();

      curY += 34;
      ctx.fillStyle = '#66605C';
      ctx.font = 'bold 16px "PingFang SC", sans-serif';
      ctx.fillText(`${article.section} · ${article.author || '硬核商业双语工作台'}`, pad, curY);

      document.getElementById('shareCardImg').src = canvas.toDataURL('image/png');
      document.getElementById('shareModal').classList.add('open');
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.remove('open');
    }

    function copyShareSummary() {
      const article = DATA.articles[currentArticleId];
      if (!article) return;
      const pair = (currentSharePairIdx >= 0 && article.pairs && article.pairs[currentSharePairIdx])
        ? article.pairs[currentSharePairIdx]
        : (article.pairs && article.pairs[0] ? article.pairs[0] : null);
      const zhSnippet = pair ? pair.zh.join('\n').replace(/〔注\d+〕/g, '') : article.zhDeck;
      const enSnippet = pair ? pair.en.join('\n') : article.enDeck;
      const scoreStr = article.score ? `（五维评分：${article.score.total}分）` : '';
      const text = `【${article.zhTitle}】${scoreStr}\n${article.enTitle}\n\n${zhSnippet}\n\nEN: ${enSnippet}\n${article.link ? '\n原文：' + article.link : ''}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('已复制双语金句与原文链接！');
      });
    }

    function toggleBasket() {
      document.getElementById('basketDrawer').classList.toggle('open');
    }

    function clearBasket() {
      vocabBasket = [];
      localStorage.setItem(BASKET_STORAGE_KEY, '[]');
      renderBasket();
    }

    function copyBasketToClipboard() {
      if (!vocabBasket.length) return;
      const lines = vocabBasket.map((item, i) => `${i + 1}. **${item.term}**（${item.articleTitle}）\n   - 原句：*${item.context}*`).join('\n');
      navigator.clipboard.writeText(lines);
      alert('已复制生词篮清单！');
    }

    function renderBasket() {
      const count = vocabBasket.length;
      const btn = document.getElementById('btnBasket');
      if (btn) btn.textContent = `🗂 生词篮 (${count})`;
      const mobLbl = document.getElementById('mobBasketLabel');
      if (mobLbl) mobLbl.textContent = count > 0 ? `生词(${count})` : '生词篮';

      const body = document.getElementById('basketBody');
      if (!count) {
        body.innerHTML = '<p style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:40px;">点击英文虚线高亮词即可加入生词篮。</p>';
        return;
      }
      body.innerHTML = vocabBasket.map(item => `<div class="basket-item"><b>${item.term}</b><div>${item.meaning}</div></div>`).join('');
    }

    document.addEventListener('click', (e) => {
      const fnPop = document.getElementById('footnotePopover');
      if (fnPop && !fnPop.contains(e.target) && !e.target.classList.contains('fn-badge')) {
        hideFootnotePopover();
      }
      const vPop = document.getElementById('vocabPopover');
      if (vPop && !vPop.contains(e.target) && !e.target.classList.contains('vocab-inline')) {
        hideVocabPopover();
      }
    });

    // 初始化：电脑默认左右对照，手机默认『逐段双语』+ 先展示全屏榜单页（若URL带 ?id= 则直接进入对应文章阅读页）
    loadBookData('global_biz_intel');
    if (window.innerWidth > 768) {
      setViewMode('side');
    } else {
      setViewMode('stack');
    }
    const urlParams = new URLSearchParams(window.location.search);
    const paramId = parseInt(urlParams.get('id'), 10);
    if (paramId && DATA.articles && DATA.articles[paramId]) {
      selectArticle(paramId, true);
    }
    renderBasket();
  </script>
</body>
